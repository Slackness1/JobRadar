<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>统一对话 Hub 外壳 · HiFi · JobRadar</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="colors_and_type.css" />
<link rel="stylesheet" href="hifi-tokens.css" />
<style>
  html, body { height: 100%; margin: 0; }
  body { background: var(--parchment); }
  #root { height: 100vh; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--ring-warm); border-radius: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  .hf-btn:disabled { cursor: default; }
  /* The shared .hf-slide entrance animates from opacity:0; in capture/re-render
     contexts the clock can sit at t=0 and strand content hidden. Neutralize. */
  .hf-slide { animation: none !important; opacity: 1 !important; }
  /* rotating typewriter placeholder in the composer */
  .hub-composer-input::placeholder { color: var(--stone); opacity: 1; }
  .hub-composer-input::-webkit-input-placeholder { color: var(--stone); opacity: 1; }
  /* "settling down" feel when the centered composer hands off to the docked layout */
  @keyframes hub-dock { from { opacity: .5; transform: translateY(-22px); } to { opacity: 1; transform: none; } }
  @keyframes hub-thread-in { from { transform: translateY(10px); } to { transform: none; } }
  .hub-dock { animation: hub-dock .46s cubic-bezier(.22,.61,.36,1); }
  .hub-thread-in { animation: hub-thread-in .5s ease-out; }
  /* resume editor full-screen takeover entrance — animate transform only so the
     overlay is never stranded hidden if the animation clock is paused (capture/throttle) */
  @keyframes hub-editor-in { from { transform: scale(0.985); } to { transform: none; } }
  .hub-editor-in { animation: hub-editor-in .3s cubic-bezier(.22,.61,.36,1); transform-origin: 60% 40%; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- shared hi-fi primitives (I icon set, HFLogo) -->
<script type="text/babel" src="hifi-primitives.jsx"></script>
<!-- reused recommend module: data + feed + chat (window.NLData / NLFeed / NLChat) -->
<script type="text/babel" src="nlrec/nlrec-data.jsx"></script>
<script type="text/babel" src="nlrec/nlrec-feed.jsx"></script>
<script type="text/babel" src="nlrec/nlrec-chat.jsx"></script>
<!-- 深度思考 embeddable card (replaces border-beam SkillRunCard) -->
<script type="text/babel" src="hub/hub-deepthink.jsx"></script>
<!-- workspace 左栏梯队骨架 rail (接入「梯队骨架」画布槽) -->
<script>window.useS = React.useState;</script>
<script type="text/babel" src="hifi-ws-rail.jsx"></script>
<!-- Hub shell: sidebar + slot views + orchestrator -->
<script type="text/babel" src="hub/hub-views.jsx"></script>
<!-- Resume editor (全屏接管：从「简历优化」点「展开编辑器」进入) -->
<script type="text/babel" src="hub/hub-editor-ai.jsx"></script>
<script type="text/babel" src="hub/hub-editor.jsx"></script>
<script type="text/babel" src="hub/hub-app.jsx"></script>
</body>
</html>
