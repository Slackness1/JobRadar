# 13 canonical finance tracks — knowledge base
#
# 2026-05-23 重写 (10 → 13): 拆 二级买方·基本面 / 卖方研究·S&T / 一级市场 各成 2,
# 拆 战略咨询 + 管理咨询·MBB 重组为 咨询·MBB+Tier2 + 企业战略·管培·实业金融。
#
# 每个 track 写满:
#   - typical_employers   典型雇主 (≥5)
#   - typical_roles       典型岗位 (≥3)
#   - high_quality_signals 高质量信号词 (招聘文案 / 个人经历里出现就 boost)
#   - low_quality_signals 低质量信号词 (出现就 dock — 跟 quality.py 红线互补)
#   - star_examples       1-2 个 STAR 模板示例 (给 chat.py rewrite 当 reference)
#   - followup_templates  典型 follow-up 提问 (给 interview 当弹药)
#
# 维护:
#   - 改了之后必须跑 `pytest tests/test_phase_d_track_knowledge.py`
#   - canonical name **必须** 跟 app/services/taxonomy/canonical.py 的 CANONICAL_FINANCE_TRACKS 一致

tracks:

  - canonical: 公募/资管·投研
    description: 公募基金 / 保险资管 / 券商资管 / 银行理财子的 long-only 基本面研究 + 投资岗。看公司基本面、行业趋势,做选股配置。SAIF placement 最大头。
    typical_employers:
      - 易方达基金
      - 华夏基金
      - 南方基金
      - 嘉实基金
      - 广发基金
      - 富国基金
      - 兴证全球
      - 招商基金
      - 工银瑞信
      - 招银理财
      - 平安资管
      - 国寿资管
    typical_roles:
      - 行业研究员
      - 基本面研究员
      - 投资经理助理
      - 多策略研究员
      - 固定收益研究员
      - 资管投资助理
    high_quality_signals:
      - 自下而上选股
      - 估值建模 DCF
      - 行业深度报告
      - 上市公司草根调研
      - 跟踪公司财报季 财务建模
      - 投资逻辑 / 投资框架
      - 持仓归因 / Brinson 归因
    low_quality_signals:
      - 渠道销售
      - 财富顾问
      - 寿险销售
      - FOF销售
      - 理财经理
    star_examples:
      - context: 公募基金消费组实习,组长让一周内出某调味品公司投资建议
        task: 拉过去三季度的渠道库存 + 终端动销 + 龙头竞品价格策略,判断是否加仓
        action: 跑了 6 家 KA 商超 + 调研 12 家经销商,建了量价模型对比同业,周报里给"减仓"建议
        result: 报告被组里采纳,该 ticker 在后续 2 个月跌 11%,免了组里至少 0.3% drawdown
      - context: 保险资管股票组实习,负责 TMT 板块跟踪
        task: 给某 AI 算力公司出 entry 信号
        action: 比对 H100 / 国产替代 ASIC 出货量 / 招标价 / 客户回款节奏 4 个维度做 DCF,触发条件清单写明
        result: signal 触发 entry,该笔头寸 3 个月收益 18%,纳入组里 paper portfolio
    followup_templates:
      - 你写"自下而上选股",具体怎么定义"基本面发生变化"才会动手买入卖出?
      - 你做 DCF 时,WACC 怎么取?永续增长率 g 多少合理?给我一个你自己研究过的具体案例。
      - 调研一家上市公司时,你最关注的财务指标排前 3 是什么?为什么这 3 个?
      - 你买入持仓后多久会复盘?复盘的 trigger 是什么?

  - canonical: 私募·基本面
    description: 阳光私募 / 对冲基金的基本面研究 + 长短仓投研。比公募更看重独立判断、深度研究和投资 sense,门槛更高。
    typical_employers:
      - 高毅资产
      - 景林资产
      - 重阳投资
      - 淡水泉投资
      - 宁泉资产
      - 观砚投资
      - 佳期投资
      - 启林投资
      - 进化论资产
      - 知行通达
      - 拾贝投资
      - 翼虎投资
    typical_roles:
      - 私募研究员
      - 行业研究员 (私募)
      - 长短仓研究员
      - 投资经理助理
      - 基本面研究员
    high_quality_signals:
      - 草根调研
      - 行业深度报告
      - 投资备忘录
      - long-short 配对
      - 估值建模 DCF / SOTP
      - 跟踪上市公司 IR / 经销商访谈
      - alpha 来源拆解
      - 仓位管理
    low_quality_signals:
      - 私募销售
      - FOF 销售
      - 渠道推广
    star_examples:
      - context: 高毅资产消费组实习,负责一家区域龙头啤酒公司深度跟踪
        task: 判断旺季前是否值得加仓,给 PM 出做多 / 减仓 / 观望建议
        action: 走访 4 个核心市场经销商 + 拉 12 个月渠道库存数据 + 比对竞品价格带,做了价量分解模型
        result: PM 采纳"旺季前加仓"建议,3 个月该 ticker 跑赢板块 8%,实习留任 offer
      - context: 重阳投资 TMT 组实习,跟踪国产替代板块
        task: 评估某 AI 芯片公司是否值得 long;同时识别短线 short pair
        action: 比较公司客户结构 / 出货量 / 国产化率三条曲线,构建 long 该标的 + short 同业 ETF 的配对组合
        result: 配对组合 6 周内 +5.2% (对冲掉板块系统性回调),被组内当 case study
    followup_templates:
      - 私募和公募研究最大的差异在你看来是什么?为什么你选私募?
      - 你做的草根调研里,哪一次让你彻底改了 view?具体改了什么?
      - 长短仓配对的 short 端怎么挑?对冲精度怎么衡量?
      - 私募的回撤容忍度比公募低很多,你怎么平衡 conviction 和风控?

  - canonical: 量化
    description: 头部私募 / 大型基金量化部 / 海外对冲基金的量化研究 / 策略开发 / 高频交易岗。看因子、看回测、看 IR。
    typical_employers:
      - 幻方量化
      - 九坤投资
      - 衍复投资
      - 灵均投资
      - 明汯投资
      - 锐天投资
      - 进化论资产
      - Citadel
      - Two Sigma
      - Jane Street
    typical_roles:
      - 量化研究员 (Quant Researcher)
      - 策略研究员
      - 高频交易员
      - 量化开发 (Quant Dev)
      - 因子研究员
      - 机器学习研究员
    high_quality_signals:
      - 因子挖掘 alpha
      - 回测框架 backtest
      - 信号衰减 IC IR
      - 高频信号 microstructure
      - 强化学习 / 深度学习量化应用
      - 期权希腊字母对冲
      - 风险因子模型 Barra
    low_quality_signals:
      - 量化销售
      - 期货经纪
      - 量化客户经理
    star_examples:
      - context: 在某头部量化私募做 alpha 因子研究实习
        task: 在已有 300 个因子上找出在中证 500 池子里 IR > 0.8 的新增因子
        action: 从微观结构挖掘 5 个 order-book-imbalance 衍生信号,3 个月内日内 IC 0.04 / IR 1.1
        result: 2 个因子被并入实盘组合,实盘 6 个月跑赢沪深 300 7.2%
      - context: ACM 算法竞赛背景 + ML coursework
        task: 复现 Tabnet + LSTM 在期货分钟数据上的端到端 pipeline
        action: 自己写 backtest 引擎,加入 transaction cost + slippage 仿真,做 walk-forward CV
        result: 模型在样本外 sharpe 1.5,被实习公司纳入 paper portfolio
    followup_templates:
      - 你说做了一个因子 IR 1.1,因子衰减率是多少?半衰期几天?跨周期稳定么?
      - 你回测里有没有考虑过 lookahead bias 和 survivorship bias?具体怎么避免?
      - 强化学习在 alpha 上落地最大的坑你觉得是什么?
      - Sharpe 高但 max drawdown 大,你愿意上实盘么?为什么?

  - canonical: 卖方研究
    description: 券商研究所 sell-side equity research。出深度报告、做客户路演、跟踪行业基本面、参与新财富 / 水晶球评选。
    typical_employers:
      - 中信证券研究所
      - 中金公司研究所
      - 华泰证券研究所
      - 招商证券研究所
      - 海通证券研究所
      - 国信证券研究所
      - 中信建投研究所
      - 申万宏源研究所
      - 国泰君安研究所
      - 摩根士丹利研究部
      - JP Morgan 研究部
    typical_roles:
      - 行业研究员 (sell-side)
      - 宏观策略研究员
      - 固收研究员
      - 金融工程研究员
      - 首席助理
      - 研究助理
    high_quality_signals:
      - 卖方深度报告
      - 路演 + 机构对接
      - 行业 ranking (新财富 / 水晶球)
      - Bloomberg 终端使用
      - 利率曲线 / 信用利差
      - 公司模型 + 行业 chart deck
      - 客户覆盖 / 派点
    low_quality_signals:
      - 期货经纪
      - 渠道销售
      - 投顾营销
    star_examples:
      - context: 中信证券 TMT 行业组研究实习
        task: 协助首席分析师写一家半导体公司深度
        action: 跑了产业链上下游 11 家公司、对比 4 家国际同业,做 5 年财务预测 + 3 张 chart deck
        result: 报告被纳入年度 top picks,3 个月内股价 +24%,机构覆盖度从 2 家涨到 9 家
      - context: 海通固收研究 SUMMER PROGRAM
        task: 跟踪利率债走势 + 写每日利率市场点评
        action: 用收益率曲线 PCA 分解 level / slope / curvature 3 因子,识别曲线变陡机会
        result: 模型 4 周内 hit 3 次方向预测,被组长采纳作 weekly outlook
    followup_templates:
      - 你的深度报告里假设哪一条最有可能错?如果错会怎么调?
      - 路演时机构投资者最常 push back 的点是什么?你怎么 handle?
      - 卖方派点机制下,你怎么平衡报告质量和 client coverage 数量?
      - 行业 ranking 评选里,大客户的 voting 占多少?写报告时会不会因此 bias?

  - canonical: S&T·FICC·衍生品
    description: Sales & Trading / FICC / 全球市场部 / 衍生品销售与结构化。外资行 GBM / 中资头部券商 FICC 业务条线。
    typical_employers:
      - Goldman Sachs GBM
      - Morgan Stanley FICC
      - JP Morgan Markets
      - Citi GBM
      - HSBC Markets
      - UBS S&T
      - 中金 FICC
      - 中信证券衍生品
      - 中信建投 FICC
      - 国泰君安销售交易
    typical_roles:
      - Sales (机构销售)
      - Trader (债券 / 衍生品 / 外汇)
      - Structurer
      - FICC Analyst
      - 衍生品销售
      - 跨境业务
    high_quality_signals:
      - 利率曲线 / 信用利差
      - 衍生品定价 (Black-Scholes)
      - 期权 vol surface
      - 客户覆盖 / 询价 / RFQ
      - 套保结构设计
      - 做市报价 / market making
      - 头寸管理 PnL attribution
      - Bloomberg / Reuters 终端
    low_quality_signals:
      - 期货零售经纪
      - 大宗电商运营
      - 个人金融顾问
    star_examples:
      - context: 中金 FICC 利率组暑期实习
        task: 跟踪 10Y 国债收益率,给 trader 提供 daily desk note
        action: 结合 CPI / 央行 OMO 操作 + 同业 dealer 报价,建立日度方向打分模型 (rule-based 4 因子)
        result: 模型一周 hit 4 次,trader 用来 size 当日交易,组里采纳作为日常 input
      - context: HSBC Markets 外汇衍生品实习,负责亚太客户
        task: 帮一家出口客户设计 USD/CNH 远期 + 期权组合,锁定 Q4 应收账款
        action: 跑了客户半年现金流模型 + 历史波动率,设计领口期权方案 (collar)
        result: 方案被客户采纳,锁定汇率风险敞口约 6 亿美元,desk 拿到 ~ 80 bps 利润
    followup_templates:
      - 你最熟悉哪个 product 的定价? Black-Scholes 的哪个 input 你最不信?
      - desk PnL 和客户 flow 之间的 conflict 你怎么 handle?
      - 做 market making 时,如果库存累积了一个方向 view 跟你想做的反向,你怎么办?
      - 利率上行周期里,你会怎么调整 desk 的久期暴露?

  - canonical: 投行·并购·资本市场
    description: IBD (Investment Banking Division) / M&A / ECM / DCM 资本市场业务。内资头部券商投行 + 外资 bulge bracket。
    typical_employers:
      - 中金公司 IBD
      - 中信证券 IBD
      - 华泰证券 IBD
      - 中信建投 IBD
      - 国泰君安 IBD
      - 海通证券 IBD
      - Goldman Sachs IBD
      - Morgan Stanley IBD
      - JP Morgan IBD
      - Citi IBD
      - UBS IBD
    typical_roles:
      - IBD Analyst
      - M&A Analyst
      - ECM Analyst
      - DCM Analyst
      - 资本市场部
      - Pre-IPO 财务顾问
    high_quality_signals:
      - Pitch book 撰写
      - 财务建模 LBO / DCF / Comps
      - 行业 deal 复盘
      - 尽职调查 DD
      - 估值方法论 (相对估值 / 绝对估值)
      - 并购重组案例
      - IPO 全流程 (申报 / 反馈 / 路演 / 定价)
      - 同业并购研究
    low_quality_signals:
      - 投行销售
      - 资本运作顾问
      - 渠道融资
    star_examples:
      - context: 中金 IBD 暑期实习,跟一个消费品 IPO 项目
        task: 一周内完成同业可比公司分析 (comps) + DCF + 估值区间报告
        action: 拉了 8 家可比上市公司财务数据 + 行业增长假设建 DCF + 用 EV/Sales 校准估值,作出 30-35x PE 区间建议
        result: 估值区间被主席最终定价采纳,IPO 当日开盘 +18%
      - context: 摩根士丹利 M&A 实习,看一笔跨境并购
        task: 评估一家国内消费品对欧洲品牌的收购报价
        action: 跑了 LBO 模型 + 协同效应建模 + 反垄断时间表,做了 3 档报价敏感性分析
        result: 报价区间被 MD 采纳,deal 以中位价格 +5% 成交,IRR 预期 18%
    followup_templates:
      - 你做的 DCF / Comps 哪个更有说服力?为什么客户/投委会更信哪一个?
      - 估值区间最敏感的 2 个 input 是什么?变 1 个百分点估值变多少?
      - LBO 模型里你最关注的 covenant 是哪一条?为什么?
      - 你跟过的 deal 里,最后没成的原因是什么?

  - canonical: 一级股权·PE/VC
    description: PE / VC / Buyout / Growth / 产业资本 / CVC。看 deal、看尽调、看商业判断、看退出路径。
    typical_employers:
      - 高瓴投资
      - 红杉中国
      - 鼎晖投资
      - 弘毅投资
      - 华平投资
      - 凯雷投资
      - KKR
      - TPG
      - 黑石
      - 淡马锡
      - 君联资本
      - IDG 资本
      - 经纬创投
      - 启明创投
    typical_roles:
      - PE Analyst
      - VC Analyst
      - 投资经理 / 投资经理助理
      - 战略投资分析师
      - 产业基金投资
      - Pre-IPO 投资分析师
    high_quality_signals:
      - 尽职调查 DD
      - 估值方法论 (相对估值 / 绝对估值)
      - 商业模式拆解
      - 行业空间 market sizing
      - 募投管退 全流程
      - 投后管理
      - SaaS / 消费 / 医药 / 半导体 等垂直行业积累
      - LP / GP 关系
    low_quality_signals:
      - PE 募资销售
      - LP 渠道运营
      - 财务投资顾问 (零售端)
    star_examples:
      - context: 高瓴 PE 实习,看 SaaS 标的
        task: 评估一家 to-B 数据库公司 Series C 是否值得 lead 投
        action: 跑 NDR / LTV/CAC / Rule of 40 三个 SaaS 核心指标,做敏感性分析 + 同业 multiple 对照
        result: 建议 cap valuation @ 8x ARR,实际 deal 按 7.5x ARR 完成,IRR 预期 22%
      - context: 红杉中国 VC 实习,看一家半导体设备早期项目
        task: 在 Series A 阶段评估技术路线 + 团队 + 市场空间,判断是否进入下轮跟投池
        action: 比对国际同业技术路线 / 客户量产时间表 / 创始团队大厂背景,做风险打分
        result: 该项目被纳入跟投池,半年后 Series B 进入,公司账面 +1.8x
    followup_templates:
      - 你看过的项目里,最后被 IC 否决的核心理由是什么?
      - 商业模式拆解时,你最关注的 unit economics 指标是哪一个?
      - SaaS / 消费 / 医药 / 硬科技 — 你最擅长哪一个垂直?为什么?
      - 投后管理里,GP 能真正 add value 的最大方向是什么?

