        action: 拆解 EBITDA 调整项 + 应收应付滚动 + 现金流季节性,找出 normalized EBITDA
        result: 报告把买方调整估值下调 6%,谈判中拿回 2,000 万元 cash adjustment
    followup_templates:
      - 你的 market sizing 用 top-down 还是 bottom-up?两条口径差多少?差异怎么解释?
      - 客户给的方向和你独立分析出来的方向冲突,你怎么处理?
      - PE 客户做 CDD 和买方公司做 CDD 关注点有什么不同?
      - 一周时间完成 FDD,你是怎么 prioritize 工作的?哪些必须做,哪些可以 skip?
