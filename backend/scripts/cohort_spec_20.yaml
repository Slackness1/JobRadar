# ========== 项目方向 (按 cohort 限制) ==========
project_themes:
  二级买方·基本面:
    - 行业深度报告 (覆盖 3-10 只股票,撰写 5-30 篇个股深度,1-5 篇被采纳/入会)
    - DCF / Comps 估值建模
    - 财务模型搭建 (3 张报表预测)
    - 跟踪上市公司 + 路演纪要 + 业绩点评
    - 商品研究 / 周期股研究
  量化:
    - 因子挖掘 (Alpha 因子 / 行业轮动 / 风格因子)
    - 回测框架搭建 (Python / pandas / vectorbt)
    - 风险模型 / 组合优化
    - 机器学习选股 (XGBoost / 神经网络)
    - 高频做市 / Stat Arb (海外做市学生)
  一级市场:
    - IPO 项目财务尽调 (整理底稿 100-500 页)
    - LBO / M&A 模型搭建
    - 估值分析 (Comps + Precedent + DCF)
    - 行业研究报告 (写给客户 / 内部投委会)
    - 投后管理 / 行业 mapping
  卖方研究·S&T:
    - 行业研究报告 (覆盖 5-15 家上市公司)
    - 总量研究 (策略 / 宏观 / 固收)
    - 数据 wrangling + Excel 模型
    - 客户路演 / 调研纪要
  银行·总行核心:
    - 信贷审批 / 风险管理
    - FICC 投资助理 / 自营研究
    - 投行部 ECM / DCM 项目跟进
    - 管培轮岗 (零售 / 公司 / 国际业务)
  金融咨询:
    - 战略尽调 / 商业尽调 (CDD / VDD)
    - 财务尽调 (FDD) / 估值
    - 数据分析 + Excel 模型
    - 客户访谈 + 行业 mapping
  金融科技:
    - 风控模型 (反欺诈 / 信用评分)
    - 量化策略 (券商科技子公司 / 蚂蚁财富科技)
    - 数据分析 + ETL
    - 算法工程 (NLP / 推荐系统)
  监管·体制内:
    - 监管研究 / 政策分析
    - 数据统计 + 报告撰写
    - 项目跟进 (申报 / 审批)

