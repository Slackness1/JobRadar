# ========== 数字范围 (严防夸大) ==========
metric_ranges:
  覆盖股票数: [3, 12]   # 不允许 50+/100+
  撰写报告数: [3, 30]    # 不允许 100+
  财务尽调底稿页数: [100, 800]  # 真实 IPO 项目范围
  实习时长: [3, 12]       # 月
  跟踪标的: [3, 10]

# ========== 学生 chat simulator 约束 ==========
simulator_rules:
  - 模拟该学生身份时,**严格基于 profile_hint 的真实经历**,不在对话里突然新增实习/项目
  - 当系统提议加 "DCF模型 / Bloomberg / 神经网络" 等 evidence 没有的细节 → 拒绝并要求更聚焦真实经历
  - 主动引导系统说"如何把我已有的 X 经历写得更有行业深度"
  - 每轮 user 消息控制在 50-120 字,接近真实学生提问长度
  - 模拟 4-6 轮对话,直到学生满意或系统给不出更深的建议
  - 真实学生不会用"请基于 STAR 原则改写"这种 AI 黑话,要用大白话

# ========== Judge 评分 rubric ==========
judge_rubric:
  ① Track Relevance:
    评 top-10 推荐里,跟该学生 cohort 一致 (subset) 或可迁移 (transferable) 的占比。
    0=<60%, 1=60-79%, 2=80-94%, 3=≥95%
  ② Fit Explanation Quality:
    评 top-3 推荐的 strengths 字段,是否引用学生简历里的**具体**事实 (实习公司+组别 / 项目名 / 技能)。
    0=全空话, 1=部分具体但不深, 2=多数具体, 3=每条都引用
  ③ Priority Accuracy:
    评 top-10 的 priority_letter A/B/C/D 分布是否合理。顶级品牌+强匹配应该 A;弱背景+错位应该 D。
    0=完全乱, 1=部分合理, 2=大部分合理, 3=全合理
  ④ Evidence Groundedness:
    评 chat 后 final profile 的所有 bullet,是否基于学生原有经历 (不是 chat 中 LLM 编造)。
    0=多处编造, 1=个别编造, 2=只有微调, 3=全部 trace 回原经历
  ⑤ Overclaim Rate:
    评 chat 后 final profile 是否出现"参与→主导"角色升级或"被采纳/获奖"声明编造。
    0=多处夸大, 1=偶有夸大, 2=保持原档, 3=无任何夸大
  ⑥ Actionability:
    评 chat 中所有 rewrite_options 是否真的可 apply (有 field_path + 学生选了一个)。
    0=无可用 option, 1=能 apply 但不深, 2=能 apply 且贴近真实经历, 3=全 actionable
  额外 · 行业深度:
    评 chat 后 final profile 是否比 initial 更有金融行业深度 (具体术语 / 量化数字 / 业务理解)。
    0=没提升, 1=略有, 2=明显提升, 3=深度行业表达
