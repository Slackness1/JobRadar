[pytest]
testpaths = tests

# `integration` tests hit real third-party sites (e.g. the Nowcoder scraper
# smoke test), so their result depends on someone else's uptime and rate limits.
# They stay out of the default run — a regression gate has to fail only when we
# broke something. Run them deliberately:
#
#     PYTHONPATH=. .venv/bin/pytest -m integration
#
# A `-m` on the command line overrides the one below.
markers =
    integration: hits live external services; run manually, not in the default gate

addopts = -m "not integration"
