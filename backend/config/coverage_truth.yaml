  # ─────────────────────────── 资管 / 理财子公司 ────────────────
  # mode=derived_company：从 jobs 表里按 company 名称关键词聚合，因为这些
  # 公司大多通过母公司 portal 顺带抓到（银行系理财子 / 央国资 资本平台 /
  # 资管子公司 / 财富管理子公司），无独立 ATS 必要。
  - id: asset_mgmt
    name: 资管 / 理财
    canonical_tracks: [二级买方·基本面]   # 银行理财子/资管子,典型二级买方
    mode: derived_company
    company_keywords_include:
      - 理财
      - 资管
      - 资产管理
      - 财富管理
      - 资本
    company_keywords_exclude:
      - 中交         # 中交集团 投资管理 = 物资管理 噪声
      - 物资         # 物资管理专员 噪声
      - 信息股份      # 东方财富信息股份 = 信息服务，不是资管
    note: |
      派生赛道 — 从 jobs 表 company 字段筛 ___理财 / ___资管 / ___资本 /
      ___财富管理 实体。已有数据样例：浙银理财 / 中邮理财 / 交银理财 /
      复星财富管理 / 五矿资本 / 越秀资本 / 银河德睿资本 / 中化资本。

  # ─────────────────────────── 信托 ──────────────────────────────
  # mode=derived_company：信托子公司基本走母公司 portal (中信集团/平安集团/
  # 华能集团/国投/浦发/五矿)，已经被其它 crawler 顺带抓到。subagent
