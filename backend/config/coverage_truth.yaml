# JobRadar 顶级平台覆盖看板 — 真值表
#
# 用途：
#   /api/coverage 读取此文件，按 (track × T1 公司) 维度计算覆盖率。
#   "Active" 判定来自 company_crawl_logs 最近 7 天 fetched_count > 0。
#
# 字段：
#   tracks[].id              内部 id
#   tracks[].name            显示名（赛道名）
#   tracks[].canonical_tracks  列表，映射到 app.services.taxonomy 的 8 大 canonical
#                              金融赛道。空 list = 非金融或不属于 SAIF audience 关心
#                              的 canonical 范畴。Phase F (2026-05-16) 加入；只读 hint
#                              字段，coverage 计算逻辑不依赖；下游 UI 可按 canonical
#                              做二级聚合。
#   tracks[].source_match    company_crawl_logs.source 字段匹配的值列表
#   tracks[].mode            'enumerate' = 列 T1 计算覆盖率
#                            'absolute'  = 不列 T1，仅显示 active 绝对数（国央企用）
#   tracks[].t1_companies[]  T1 公司清单（mode=enumerate 时必填）
#     name              T1 显示名
#     aliases           可选，DB company 字段实际匹配的别名（默认就是 name）
#     deferred_reason   可选，明确标 deferred 的原因；不填 = 期望 active

tracks:

  # ─────────────────────────── 互联网 ─────────────────────────────
  - id: internet
    name: 互联网
    canonical_tracks: [金融科技]   # 蚂蚁/字节金融/腾讯金科;非金科部门 SAIF 投递率低
    source_match: [internet_official]
    mode: enumerate
    t1_companies:
      - name: 字节跳动
      - name: 阿里巴巴
      - name: 腾讯
      - name: 美团
      - name: 拼多多
      - name: 百度
      - name: 京东
      - name: 网易
      - name: 滴滴
      - name: 蚂蚁集团
      - name: 快手
      - name: 哔哩哔哩
      - name: 小红书
      - name: 携程
      - name: 米哈游
      - name: 得物
      - name: BOSS直聘
      - name: 小米
        deferred_reason: 北森反爬 + 反 debug；ROI 偏低，待秋招重测
      - name: 华为
        deferred_reason: 北森系反爬强度同小米；招聘走 OD/海外子站，公开列表不全
      - name: 知乎
        deferred_reason: SPA 强反爬 + 校招岗位极少（≤10/年）

  # ─────────────────────────── 银行 ───────────────────────────────
  - id: banks
    name: 银行 (T0+T1)
    canonical_tracks: [银行·总行核心]   # 理财子另走 asset_mgmt
    source_match: [bank_official, bank-legacy-csv]   # legacy CSV 也归 银行 桶
    mode: enumerate
    t1_companies:
      # T0 国有六大
      - name: 工商银行
      - name: 中国银行
      - name: 建设银行
      - name: 农业银行
        # 2026-05-27: career.abchina.com SPA hash 路由 (#/99 校招 / #/103 实习)
        # Decodo Camoufox 渲染 OK (Playwright Chromium 之前被 anti-debug 识破)。
        # SPA 自己跑 jsencrypt + SM3 加密 → 服务端返完整 nav + "招聘机构"
        # (33 分行 + 农银投资/农银理财)。当前 "暂无热招事项" — 渠道通,
        # 等秋招开闸自动收。source=bank_official(子 source bank_abc_decodo)。
      - name: 交通银行
        deferred_reason: 主域 SSL legacy renegotiation 才通；首页/m 站均无公开 jobs 通道；走 WeChat 小程序/微招聘
      - name: 邮储银行
      # T1 股份制 12
      - name: 招商银行
      - name: 浦发银行
      - name: 中信银行
      - name: 兴业银行
      - name: 民生银行
      - name: 平安银行
        aliases: [平安集团, 平安银行]
        jobs_company_match: [平安银行]      # 含 平安银行 + 平安银行股份有限公司
      - name: 华夏银行
      - name: 浙商银行
      - name: 广发银行
      - name: 渤海银行
      - name: 光大银行
        deferred_reason: cebbank.zhiye.com 站点已下线 (404)；www.cebbank.com 主域 412 + WAF JS challenge；51job 通道锁 2024 老批次
      - name: 恒丰银行
        deferred_reason: 412 + JS challenge ($_ts.cd 加密 cookie 同 ABC)；career/hr/zp 子域 SSL 全失败

  # ─────────────────────────── 保险 ───────────────────────────────
  - id: insurance
    name: 保险
    canonical_tracks: [公募/资管·投研]   # 保险资管 = long-only 资管;前台精算/承保 SAIF 不投
    source_match: [insurance_official]
    mode: enumerate
    t1_companies:
      - name: 中国人寿
      - name: 中国人保
      - name: 中国太平
      - name: 中国平安
        aliases: [平安集团, 中国平安, 平安保险]
        # 平安集团 portal 一锅烩，但 jobs.company 已按子实体拆开（平安寿险/产险/
        # 人寿/财产/养老/健康）。用 jobs_company_match 让 coverage.py 走 jobs 表
        # backup 查询，从而在 insurance track 里也能看到 平安 active。
        jobs_company_match: [平安寿险, 平安产险, 平安人寿, 平安财产保险, 平安养老, 平安健康]
      - name: 中国太保
        deferred_reason: cpic.zhiye.com 404；DNS 部分不解析。秋招开窗再评估
      - name: 新华保险
        deferred_reason: m API 当前 rows=0，季节空；秋招开窗再 wire
      - name: 泰康保险
        deferred_reason: 无独立 ATS（WeChat 小程序为主）
      - name: 友邦保险
        aliases: [友邦保险, AIA]
        jobs_company_match: [AIA]
        # 2026-05-26 修正诊断: 之前 "需 HK-IP" 是错的判断。实测 VPS plain
        # curl_cffi chrome120 直通 aia.wd3.myworkdayjobs.com/External CXS;
        # Asia 总量 HK 162 / SG 84 / China 198,含 2026 AIA HK+Macau Summer
        # Internship Program。首爬 +116 入库 (HK/SG/Shanghai/Macau)。
      - name: 平安资产管理
        aliases: [平安资管, 平安资产管理]
        jobs_company_match: [平安资管, 平安资产管理]
        # 2026-05-28 T8 派单 Tier A 第 5 家。实测 campus.pingan.com 是平安集团
        # 统一 ATS,SPA Vue + chunks (chunk_position/chunk_freshStudent 等);
        # JS bundle 里 API 路径找到了 /candidate/position/campus/positionSearch/
        # queryPositionPage,但所有 POST 都返 405 (proxy 层拦),GET 返 SPA shell。
        # Decodo Camoufox render 各子路由都只见 38KB boilerplate,SPA 内部 fetch
        # 失败 — 跟 BofA/BNP/SC/Nomura 同款 application-layer 反爬 (需 session
        # cookies + CSRF token,可能要登录态)。结构性 backlog,需 Multilogin
        # 类真指纹浏览器 + 行为脚本。当前 0 rows in DB。
        deferred_reason: campus.pingan.com SPA + 405 反爬;同 BofA/BNP 套路,需 Multilogin 真指纹浏览器,ROI 中等 backlog

  # ─────────────────────────── 券商 ───────────────────────────────
  - id: securities
    name: 券商 T1
    canonical_tracks: [卖方研究, S&T·FICC·衍生品, 投行·并购·资本市场]   # 研究所/S&T/IBD 现已拆三档
    source_match:
      - securities_zhiye
      - securities_zhiye_legacy
      - securities_moka_embedded
      - securities_hotjob
      - securities_citics_dom    # 中信证券 careers.citics.com Playwright + 用户 cookie
    mode: enumerate
    t1_companies:
      - name: 中信证券
        jobs_company_match: [中信证券]
        # 2026-05-24: careers.citics.com 必须登录,Playwright + 用户 cookie 抓
        # /summer/interns SPA DOM,实测 2026 总部暑期实习 10 岗 (投行/固收/资管/
        # 股衍/机构/研究/两融/研发/风控合规/财务运营 业务助理),source=
        # securities_citics_dom。cookie 有效期 7d,需周期性 refresh。
      - name: 中金公司
        jobs_company_match: [中金公司]
      - name: 华泰证券
        # exclude '联合证券' 防止华泰联合 子公司被算到母 entry (单独 backlog 已配)
        jobs_company_match: [华泰证券]
      - name: 华泰联合证券
        # 2026-05-28: T8 派单 Tier A 第 6 家。华泰联合证券是华泰证券投行子品牌,
        # 没独立 ATS — piggyback 母券商 wecruit.hotjob.cn/SU6419b58b... 校招池。
        # DB 实测 7 IBD 岗在 company='华泰证券' / '华泰证券股份有限公司' 下
        # (title 含'投资银行股权业务岗' / '债券业务岗' / 'REITs承做业务岗'),
        # 由 investment_banking 派生 track 自动识别 (line 552 already includes
        # 华泰联合 in company_keywords)。这里加 T1 entry 让 SAIF UI 显示
        # "华泰联合证券 active",但 jobs_company_match=[华泰联合证券,华泰联合]
        # 当前返 0 (Tata 数据无独立法人 row),deferred_reason 指向派生 track。
        aliases: [华泰联合证券, 华泰联合]
        jobs_company_match: [华泰联合证券, 华泰联合]
        deferred_reason: piggyback 华泰证券 SU6419 hotjob;7 IBD 岗见 investment_banking 派生 track (title 含 投行/承做/承销/REITs)
      - name: 国泰海通
        # 2026 合并后母券商。aliases 含历史名 国泰君安 / 海通证券
        aliases: [国泰君安, 海通证券, 国泰海通]
        # exclude '期货' 防止国泰君安期货子被算到母 (Tata 误标已 fix 但保险措施)
        jobs_company_match: [国泰海通]
      - name: 招商证券
        jobs_company_match: [招商证券]
      - name: 广发证券
        jobs_company_match: [广发证券]
      - name: 中信建投
        jobs_company_match: [中信建投]
      - name: 申万宏源
        jobs_company_match: [申万宏源]
      - name: 东方证券
        jobs_company_match: [东方证券股份有限公司, 东方证券]
        # 注意: 东方证券资管 / 东方红资管 (上海东方证券资管) 应归 securities_am
      - name: 平安证券
        aliases: [平安集团, 平安证券]
        jobs_company_match: [平安证券]
      - name: 银河证券
        jobs_company_match: [中国银河证券, 银河证券]
      - name: 兴业证券
        jobs_company_match: [兴业证券]
      - name: 国信证券
        jobs_company_match: [国信证券]
      - name: 长江证券
        jobs_company_match: [长江证券]
      - name: 中泰证券
        jobs_company_match: [中泰证券]
      - name: 东吴证券
        jobs_company_match: [东吴证券]
      - name: 安信证券
        # 安信改名 国投证券 — aliases 含两个
        aliases: [安信证券, 国投证券]
        jobs_company_match: [安信证券, 国投证券]
      - name: 国盛证券
        jobs_company_match: [国盛证券]
      - name: 浙商证券
        jobs_company_match: [浙商证券]
      - name: 国金证券
        jobs_company_match: [国金证券]
      - name: 天风证券
        jobs_company_match: [天风证券]

  # ─────────────────────────── 公募基金 ──────────────────────────
  - id: funds
    name: 公募基金 (top-15 by AUM)
    canonical_tracks: [公募/资管·投研]   # 公募基金为主;部分量化部门岗位极少,主线归公募投研
    source_match:
