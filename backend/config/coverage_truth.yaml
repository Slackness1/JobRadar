      - name: 今日资本
        deferred_reason: 静态形象站
      - name: 华兴资本
        deferred_reason: 投行风格，仅 LinkedIn
      - name: 北极光创投
        deferred_reason: 主页无招聘
      - name: 达晨创投
        deferred_reason: DNS 不稳

  # ─────────────────────────── 消费外企 ──────────────────────────
  - id: consumer_foreign
    name: 消费外企 (top)
    canonical_tracks: []   # 非金融,MT 校招目标,不属 8 canonical 任一项
    source_match: [consumer_foreign_official]
    mode: enumerate
    t1_companies:
      # T0 (重点投递目标)
