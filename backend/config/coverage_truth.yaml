      - name: 沃尔沃
      # 其他常见 T1（用户 follow-up 关注）
      - name: 阿迪达斯
        deferred_reason: 暂未探查
      - name: 麦当劳
        deferred_reason: 暂未探查
      - name: 星巴克
        deferred_reason: 暂未探查
