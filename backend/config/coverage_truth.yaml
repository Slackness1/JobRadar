      - 信息技术       # 上海金融期货信息技术 = 系统厂商，不算前台
    note: |
      派生赛道。已知数据：中信期货 21 / 五矿期货 20 / 国泰君安期货 13 /
      中泰期货 7 / 平安期货 5 / 南华期货 3 / 中信建投期货 3 / 永安期货 1
      / 中国金融期货交易所 1 等。

  # ─────────────────────────── 国央企 ────────────────────────────
  # mode=absolute：太多，不列 T1，只显示 active 绝对数
  - id: state_owned
    name: 国央企
    canonical_tracks: [监管·体制内]
    source_match: [state_owned_official]
    mode: absolute
    note: |
      国资委央企 100 大集团 + 重点省企 ~50 + 上市国企众多。
      不列 T1 名册，仅显示最近 7 天 active 公司绝对数。
      当前 ~119 家有效活跃，覆盖国资委 100 大的 ~60%（部分子公司散落在不同 source）。
