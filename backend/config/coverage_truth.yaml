        deferred_reason: Workday 租户级应用反爬(WorkdayDetect 行为指纹 + CSRF/session);Decodo residential 实测 422,cookie-flow 也 fail;需 Multilogin 指纹浏览器,ROI 偏低 backlog
      - name: BNP Paribas
