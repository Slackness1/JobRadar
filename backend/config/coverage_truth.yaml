      - name: 华夏基金
      - name: 嘉实基金
      - name: 广发基金
        # 2026-05-27: gffunds.jobs.feishu.cn/833056 Feishu Hire SPA via
        # Decodo (default pool ~¥0.011/req) + wait=20s 渲染。首爬 +3 实习岗
        # (AI算法/销售助理/营销策划),source=funds_feishu_hire_decodo。秋招开闸自动收。
      - name: 南方基金
        deferred_reason: hotjob ok (SU6138665)，季节性空档，秋招开闸自动收
      - name: 工银瑞信
        deferred_reason: hotjob ok (icbccs.hotjob.cn)，季节性空档，秋招开闸自动收
      - name: 博时基金
      - name: 招商基金
        deferred_reason: zhiye ok (cmfchina.zhiye.com)，季节性空档
      - name: 富国基金
      - name: 兴证全球基金
      - name: 鹏华基金
      - name: 永赢基金
      - name: 汇添富基金
      - name: 海富通基金
      - name: 大成基金
        # 2026-05-27: 用户提供真渠道 dachengjj.zhiye.com (Beisen 老式 CMS),
        # Decodo Camoufox 渲染 OK,当前 "无任何在招职位" (招聘区域 深圳/北京/
        # 上海, 类型 研究员/交易员/渠道销售岗/项目经理)。等秋招开闸自动收。
        # source=funds_beisen_legacy_decodo。
      - name: 银华基金
        deferred_reason: moka ok (yhfund/78005)，季节性空档，秋招开闸自动收

