  # 补充，写入时仍命中 keyword=信托，所以也会在派生表里出现。
  - id: trust
    name: 信托
    canonical_tracks: []   # SAIF audience 一般不投信托业务,无明确 canonical 归属
    mode: derived_company
    company_keywords_include:
      - 信托
    company_keywords_exclude: []
    note: |
      派生赛道。已知数据：交银国际信托 / 中国对外经济贸易信托 / 云南国际信托
      / 中粮信托 / 平安信托 / 国投泰康信托 / 华润深国投信托 / 光大兴陇信托
      / 中建投信托 / 中信信托 等 10+ 家。

  # ─────────────────────────── 期货 ──────────────────────────────
  # mode=derived_company：期货子公司基本走母公司证券 portal (中信/国泰君安/
  # 平安/五矿等)，期货机构本身规模小，无独立 ATS 必要。已有 80+ 岗位。
  - id: futures
    name: 期货
    canonical_tracks: [卖方研究·S&T]   # 期货研究所主要,资管/经纪 SAIF 不投
    mode: derived_company
    company_keywords_include:
      - 期货
    company_keywords_exclude:
