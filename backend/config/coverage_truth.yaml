      - hedge_funds_wintalent_sc
      - hedge_funds_self_html
      - hedge_funds_greenhouse
      - hedge_funds_eightfold
      - hedge_funds_citadel_wp
    mode: enumerate
    t1_companies:
      # === 量化私募 top 12 ===
      - name: 幻方量化
