      - name: 思勰投资
        jobs_company_match: [思勰投资]
      - name: 诚奇资产
        jobs_company_match: [诚奇资产, 诚奇基金]
      - name: 宽德投资
        jobs_company_match: [宽德投资, WizardQuant]
      - name: 因诺资产
        jobs_company_match: [因诺资产]
      - name: 进化论资产
        jobs_company_match: [进化论资产]

      # === 主观多头私募 top 8 (大多 referral_heavy) ===
      - name: 高毅资产
        jobs_company_match: [高毅资产]
      - name: 景林资产
        jobs_company_match: [景林资产, 景林]
        deferred_reason: 主观多头 — 校友办 + 海投 listings,无 ATS,referral_heavy
      - name: 淡水泉投资
        jobs_company_match: [淡水泉]
        # 2026-05-27: 用户提供 app.mokahr.com/campus-recruitment/springscapital
