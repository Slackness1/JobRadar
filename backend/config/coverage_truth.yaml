      - name: Standard Chartered
        deferred_reason: sc.wd3 / standardchartered.wd3 双域 Workday 422
      - name: Nomura
        deferred_reason: nomura.wd3.myworkdayjobs.com Workday 422
      - name: Deutsche Bank
        deferred_reason: db.wd3.myworkdayjobs.com 多个 site path 都返 404，可能已迁站
      - name: Barclays
        deferred_reason: barclays.wd3.myworkdayjobs.com 404；search.jobs.barclays 302 自定义 portal

  # ─────────────────────────── PE / VC ──────────────────────────
  - id: pe_vc
    name: PE / VC (top 头部)
