        # 投研暑期训练营 / Π型人才训练营。source=hedge_funds_moka_v3。
      - name: 睿郡资产
        jobs_company_match: [睿郡]
        deferred_reason: ruijunasset/ruijun 各 ATS 未注册,backlog
      - name: 千合资本
        jobs_company_match: [千合资本, 千合, 王亚伟]
        deferred_reason: 王亚伟主观私募,年招 <20 人,referral_heavy
      - name: 礼仁投资
        jobs_company_match: [礼仁投资]
        deferred_reason: 高瓴 Hillhouse PE 子 (gllue.com ATS),backlog
