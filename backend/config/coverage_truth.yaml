# JobRadar 顶级平台覆盖看板 — 真值表
#
# 用途：
#   /api/coverage 读取此文件，按 (track × T1 公司) 维度计算覆盖率。
#   "Active" 判定来自 company_crawl_logs 最近 7 天 fetched_count > 0。
#
# 字段：
#   tracks[].id              内部 id
#   tracks[].name            显示名（赛道名）
#   tracks[].canonical_tracks  列表，映射到 app.services.taxonomy 的 8 大 canonical
#                              金融赛道。空 list = 非金融或不属于 SAIF audience 关心
#                              的 canonical 范畴。Phase F (2026-05-16) 加入；只读 hint
#                              字段，coverage 计算逻辑不依赖；下游 UI 可按 canonical
#                              做二级聚合。
#   tracks[].source_match    company_crawl_logs.source 字段匹配的值列表
#   tracks[].mode            'enumerate' = 列 T1 计算覆盖率
#                            'absolute'  = 不列 T1，仅显示 active 绝对数（国央企用）
#   tracks[].t1_companies[]  T1 公司清单（mode=enumerate 时必填）
#     name              T1 显示名
#     aliases           可选，DB company 字段实际匹配的别名（默认就是 name）
#     deferred_reason   可选，明确标 deferred 的原因；不填 = 期望 active

tracks:

  # ─────────────────────────── 互联网 ─────────────────────────────
  - id: internet
    name: 互联网
    canonical_tracks: [金融科技]   # 蚂蚁/字节金融/腾讯金科;非金科部门 SAIF 投递率低
    source_match: [internet_official]
    mode: enumerate
    t1_companies:
      - name: 字节跳动
      - name: 阿里巴巴
      - name: 腾讯
      - name: 美团
      - name: 拼多多
      - name: 百度
      - name: 京东
      - name: 网易
      - name: 滴滴
      - name: 蚂蚁集团
      - name: 快手
      - name: 哔哩哔哩
      - name: 小红书
      - name: 携程
      - name: 米哈游
      - name: 得物
      - name: BOSS直聘
      - name: 小米
        deferred_reason: 北森反爬 + 反 debug；ROI 偏低，待秋招重测
      - name: 华为
        deferred_reason: 北森系反爬强度同小米；招聘走 OD/海外子站，公开列表不全
      - name: 知乎
        deferred_reason: SPA 强反爬 + 校招岗位极少（≤10/年）

  # ─────────────────────────── 银行 ───────────────────────────────
  - id: banks
    name: 银行 (T0+T1)
    canonical_tracks: [银行·总行核心]   # 理财子另走 asset_mgmt
    source_match: [bank_official, bank-legacy-csv]   # legacy CSV 也归 银行 桶
    mode: enumerate
    t1_companies:
      # T0 国有六大
      - name: 工商银行
      - name: 中国银行
      - name: 建设银行
      - name: 农业银行
        deferred_reason: career.abchina.com SPA = jsencrypt + sm3 + 重度 obfuscated anti-debug；POST 空 body 返 Empty reply。秋招开窗后再 Playwright + JS 钩子方案
      - name: 交通银行
        deferred_reason: 主域 SSL legacy renegotiation 才通；首页/m 站均无公开 jobs 通道；走 WeChat 小程序/微招聘
      - name: 邮储银行
      # T1 股份制 12
      - name: 招商银行
      - name: 浦发银行
      - name: 中信银行
      - name: 兴业银行
      - name: 民生银行
      - name: 平安银行
        aliases: [平安集团, 平安银行]
        jobs_company_match: [平安银行]      # 含 平安银行 + 平安银行股份有限公司
      - name: 华夏银行
      - name: 浙商银行
      - name: 广发银行
      - name: 渤海银行
      - name: 光大银行
        deferred_reason: cebbank.zhiye.com 站点已下线 (404)；www.cebbank.com 主域 412 + WAF JS challenge；51job 通道锁 2024 老批次
      - name: 恒丰银行
        deferred_reason: 412 + JS challenge ($_ts.cd 加密 cookie 同 ABC)；career/hr/zp 子域 SSL 全失败

  # ─────────────────────────── 保险 ───────────────────────────────
  - id: insurance
    name: 保险
    canonical_tracks: [二级买方·基本面]   # 保险资管 = 二级买方;前台精算/承保 SAIF 不投
    source_match: [insurance_official]
    mode: enumerate
    t1_companies:
      - name: 中国人寿
      - name: 中国人保
      - name: 中国太平
      - name: 中国平安
        aliases: [平安集团, 中国平安, 平安保险]
        # 平安集团 portal 一锅烩，但 jobs.company 已按子实体拆开（平安寿险/产险/
        # 人寿/财产/养老/健康）。用 jobs_company_match 让 coverage.py 走 jobs 表
        # backup 查询，从而在 insurance track 里也能看到 平安 active。
        jobs_company_match: [平安寿险, 平安产险, 平安人寿, 平安财产保险, 平安养老, 平安健康]
      - name: 中国太保
        deferred_reason: cpic.zhiye.com 404；DNS 部分不解析。秋招开窗再评估
      - name: 新华保险
        deferred_reason: m API 当前 rows=0，季节空；秋招开窗再 wire
      - name: 泰康保险
        deferred_reason: 无独立 ATS（WeChat 小程序为主）
      - name: 友邦保险
        deferred_reason: AIA 历史用 Workday，需要 HK-IP

  # ─────────────────────────── 券商 ───────────────────────────────
  - id: securities
    name: 券商 T1
    canonical_tracks: [卖方研究·S&T, 一级市场]   # 研究所+S&T 走卖方;IBD 走一级
    source_match:
      - securities_zhiye
      - securities_zhiye_legacy
      - securities_moka_embedded
      - securities_hotjob
    mode: enumerate
    t1_companies:
      - name: 中信证券
        deferred_reason: Playwright SPA 反爬强；待重写 crawler
      - name: 中金公司
      - name: 华泰证券
      - name: 国泰君安
        deferred_reason: 自家 SPA 校招页 token 鉴权
      - name: 海通证券
        deferred_reason: 主域 SSL 异常 + 校招走 WeChat
      - name: 招商证券
      - name: 广发证券
      - name: 中信建投
      - name: 申万宏源
      - name: 东方证券
        deferred_reason: 自家 SPA + token 鉴权
      - name: 平安证券
        aliases: [平安集团, 平安证券]
        # 同 平安保险 — 走 jobs_company_match 从 jobs 表回查
        jobs_company_match: [平安证券]
      - name: 银河证券
        deferred_reason: 校招走 WeChat
      - name: 兴业证券
      - name: 国信证券
      - name: 长江证券
      - name: 中泰证券
      - name: 东吴证券
      - name: 安信证券
      - name: 国盛证券
      - name: 浙商证券
      - name: 国金证券
      - name: 天风证券

  # ─────────────────────────── 公募基金 ──────────────────────────
  - id: funds
    name: 公募基金 (top-15 by AUM)
    canonical_tracks: [二级买方·基本面]   # 部分基金有量化部门,但岗位极少;主线归基本面
    source_match:
      - funds_hotjob
      - funds_zhiye
      - funds_moka_embedded
      - funds_zhiye_beisen_cms
      - funds_wintalent_sc
    mode: enumerate
    t1_companies:
      - name: 易方达基金
        deferred_reason: 自家 SPA，无外露 ATS
      - name: 华夏基金
      - name: 嘉实基金
      - name: 广发基金
