# 外资投行 (Bulge Bracket China offices) — 金融高薪深耕 Phase 10
#
# 2026-05-11
# All Workday CXS endpoints — same handler as Blackstone/KKR from PE/VC.
# Asia location filter applied client-side (location keyword whitelist).
#
# 422-blocked tenants (Goldman / JPM / UBS / HSBC / BofA / BNP / Standard
# Chartered / Nomura / Daiwa CM) live in coverage_truth.yaml as deferred —
# their CXS endpoints exist but reject our minimal payload. Likely need
# additional facets or per-tenant session prep.

sites:
  # Workday CXS 强制 limit≤20 (实测 25/50 返 400)。用 searchText 服务端过滤
  # 而非翻全局 100 页 — 每个公司 4 query × 8 page = 64 请求，~30s。
  - name: Citi
    handler: workday
    endpoint: https://citi.wd5.myworkdayjobs.com/wday/cxs/citi/2/jobs
    portal_url: https://citi.wd5.myworkdayjobs.com/en-US/2
    page_size: 20
    max_pages_per_query: 8
    search_queries: ["China", "Hong Kong", "Singapore", "Tokyo"]
    note: 2026-05-11 Citi 各 Asia 区岗位数 — HK:167 SG:307 China:63 Tokyo:53

  - name: Morgan Stanley
    handler: workday
    endpoint: https://ms.wd5.myworkdayjobs.com/wday/cxs/ms/External/jobs
    portal_url: https://ms.wd5.myworkdayjobs.com/en-US/External
    page_size: 20
    max_pages_per_query: 8
    search_queries: ["China", "Hong Kong", "Singapore", "Tokyo"]
    note: 2026-05-11 MS 全球 1488 岗，Asia 区类似规模

  - name: Goldman Sachs
    handler: goldman_graphql
    endpoint: https://api-higher.gs.com/gateway/api/v1/graphql
    portal_url: https://higher.gs.com
    page_size: 20
    search_queries: ["Hong Kong", "Shanghai", "Beijing", "Singapore", "Tokyo"]
    note: 2026-05-19 高盛走自建 higher.gs.com GraphQL,公开无 auth。Asia 实测 282 岗(HK 107, Tokyo 91, SG 72, Shanghai 7, Beijing 5),去重 + Asia 过滤后入库 ~146 条。

  - name: UBS
    handler: ubs_taleo_spa
    portal_url: https://jobs.ubs.com
    partner_id: 25008
    site_ids: [5012, 5131]   # 5012 = Professionals (社招), 5131 = Students (校招)
    link_ids: [15231, 15232]
    note: 2026-05-19 UBS 走 Oracle Taleo TGnewUI SPA,jobs.ubs.com 直 GET 不行(SSR HTML 没 jobs),需 Playwright 渲染。每 site 50 jobs / 页 (含 Investment Banking Analyst/Fixed Income Structurer/Senior Investment Officer 等 SAIF 关键岗)。

  # HSBC mycareer.hsbc.com SearchJobs portal — 2026-05-19 实测全 50 条全
  # 在 Poland(HSBC Global Shared Center,Operations/Tech 后台岗),Asia
  # 过滤后 0 条入库。SAIF 相关性极低。代码 `_fetch_hsbc_search_html` 保留
  # 在 crawler 模块,等将来 HSBC HK/SG 真招聘启用了再 re-enable。
  # - name: HSBC
  #   handler: hsbc_html
  #   portal_url: https://mycareer.hsbc.com
  #   page_size: 50

  # Barclays — 2026-05-23 D-10 应用突破:plain requests 触发 Workday 406,
  # curl_cffi.impersonate=chrome120 一次过 200。Asia city (HK+SG+Tokyo) +
  # IBD/Research 关键词,post-hoc Asia 过滤 → ~60 unique Asia SAIF 相关岗。
  # tls_impersonate 是 _fetch_workday_filtered 的新参数:有则走 curl_cffi、
  # 无则 plain requests(Citi/MS 保持原路径)。
  - name: Barclays
    handler: workday
    endpoint: https://barclays.wd3.myworkdayjobs.com/wday/cxs/barclays/External_Career_Site_Barclays/jobs
    portal_url: https://barclays.wd3.myworkdayjobs.com/en-US/External_Career_Site_Barclays
    page_size: 20
    max_pages_per_query: 8
    search_queries: ["Hong Kong", "Singapore", "Tokyo", "Investment Banking", "Research"]
    tls_impersonate: chrome120
    note: 2026-05-23 D-10 应用 — Workday 406 → curl_cffi chrome120 解锁。

  # Deutsche Bank — 2026-05-25 发现: db.wd3.myworkdayjobs.com/en-US/DBWebsite
  # portal 200 OK,CXS 200(38 HK + 58 SG + 34 Tokyo = ~92 unique Asia岗)。
  # curl_cffi chrome120 解锁,无需 portal pre-fetch,同 Barclays 模式。
  - name: Deutsche Bank
    handler: workday
    endpoint: https://db.wd3.myworkdayjobs.com/wday/cxs/db/DBWebsite/jobs
    portal_url: https://db.wd3.myworkdayjobs.com/en-US/DBWebsite
    page_size: 20
    max_pages_per_query: 8
    search_queries: ["Hong Kong", "China", "Singapore", "Tokyo", "Investment Banking", "Research"]
    tls_impersonate: chrome120
    note: "2026-05-25: db.wd3/DBWebsite curl_cffi chrome120 解锁 — 92 unique Asia SAIF岗。前记'自建ATS'有误，实为标准Workday wd3。"

  # HSBC — 2026-05-27 大翻案: 之前认为 mycareer.hsbc.com 是 HSBC Poland GSC
  # 专属 portal(确实如此),但 HSBC Asia 真渠道找到了 — portal.careers.hsbc.com
  # 后台用 Eightfold AI (`/gen/js/ef-*.js` 签名). API 直接 VPS curl_cffi 通,
  # Asia 总量:Mainland China 497 / HK 239 / Shanghai 99 / Taipei 87 /
  # Singapore 49 / Beijing 45 / Mumbai 45 / Bangalore 56 / Tokyo 16
  - name: HSBC
    handler: hsbc_eightfold
    portal_url: https://portal.careers.hsbc.com/careers
    page_size: 10            # Eightfold API caps at 10/req regardless of num value
    max_pages_per_query: 50  # 500/query 覆盖 Mainland China 497 总量
    search_queries: ["Hong Kong", "Mainland China", "Singapore", "Shanghai", "Beijing", "Taipei", "Tokyo", "Mumbai"]
    note: "2026-05-27: portal.careers.hsbc.com Eightfold AI /api/apply/v2/jobs 直通,无需 Decodo"

  # JP Morgan — 2026-05-26 重新诊断: 原以为是 Workday(jpmc.wd5)被 IP 软封,
  # 实际 JPM 早已迁移到 Oracle Cloud Candidate Experience。jpmc.fa.oraclecloud.com
  # /hcmRestApi/recruitingCEJobRequisitions VPS plain requests 1.1s 200 OK,
  # 无 IP 限制。Asia 总量: HK 113 / SG 76 / China 66 / Tokyo+Mumbai 等估 300+ 总。
  - name: JP Morgan
    handler: oracle_ce
    portal_url: https://jpmc.fa.oraclecloud.com/hcmUI/CandidateExperience/en/sites/CX_1001/jobs
    site_number: CX_1001
    page_size: 25
    max_pages_per_query: 8
    search_queries: ["China", "Hong Kong", "Singapore", "Tokyo", "Mumbai", "Investment Banking", "Research"]
    note: "2026-05-26: Oracle Cloud CE REST 解锁(原 Workday endpoint 是错的); siteNumber=CX_1001"

  # BofA/BNP/Nomura/StanChart/Daiwa/MUFG/Mizuho/Jefferies — 2026-05-26 修正诊断:
  # 之前以为是 ASN 软封,实测 Decodo premium residential 仍返 422 (CXS) /
  # render-timeout (portal headless)。即使 cookie-flow 同 session 也过不去。
  # 真实原因: Workday 租户级应用层反爬 — 估计开了 WorkdayDetect 行为指纹检测
  # (canvas/WebGL/mouse-move) 或要求 portal-issued session cookies + CSRF token。
  # 解法只剩 Multilogin 类真指纹浏览器 + 行为脚本 (1 周工程 + ¥600/月起),ROI 偏低。
