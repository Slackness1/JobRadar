# 外资投行 (Bulge Bracket China offices) — 金融高薪深耕 Phase 10
#
# 2026-05-11
# All Workday CXS endpoints — same handler as Blackstone/KKR from PE/VC.
# Asia location filter applied client-side (location keyword whitelist).
#
# 422-blocked tenants (Goldman / JPM / UBS / HSBC / BofA / BNP / Standard
# Chartered / Nomura / Daiwa CM) live in coverage_truth.yaml as deferred —
# their CXS endpoints exist but reject our minimal payload. Likely need
# additional facets or per-tenant session prep.

sites:
  # Workday CXS 强制 limit≤20 (实测 25/50 返 400)。用 searchText 服务端过滤
  # 而非翻全局 100 页 — 每个公司 4 query × 8 page = 64 请求，~30s。
  - name: Citi
    handler: workday
    endpoint: https://citi.wd5.myworkdayjobs.com/wday/cxs/citi/2/jobs
    portal_url: https://citi.wd5.myworkdayjobs.com/en-US/2
    page_size: 20
    max_pages_per_query: 8
    search_queries: ["China", "Hong Kong", "Singapore", "Tokyo"]
    note: 2026-05-11 Citi 各 Asia 区岗位数 — HK:167 SG:307 China:63 Tokyo:53

  - name: Morgan Stanley
    handler: workday
    endpoint: https://ms.wd5.myworkdayjobs.com/wday/cxs/ms/External/jobs
    portal_url: https://ms.wd5.myworkdayjobs.com/en-US/External
    page_size: 20
    max_pages_per_query: 8
    search_queries: ["China", "Hong Kong", "Singapore", "Tokyo"]
    note: 2026-05-11 MS 全球 1488 岗，Asia 区类似规模

  - name: Goldman Sachs
    handler: goldman_graphql
    endpoint: https://api-higher.gs.com/gateway/api/v1/graphql
    portal_url: https://higher.gs.com
    page_size: 20
    search_queries: ["Hong Kong", "Shanghai", "Beijing", "Singapore", "Tokyo"]
    note: 2026-05-19 高盛走自建 higher.gs.com GraphQL,公开无 auth。Asia 实测 282 岗(HK 107, Tokyo 91, SG 72, Shanghai 7, Beijing 5),去重 + Asia 过滤后入库 ~146 条。

  - name: UBS
    handler: ubs_taleo_spa
    portal_url: https://jobs.ubs.com
    partner_id: 25008
    site_ids: [5012, 5131]   # 5012 = Professionals (社招), 5131 = Students (校招)
    link_ids: [15231, 15232]
    note: 2026-05-19 UBS 走 Oracle Taleo TGnewUI SPA,jobs.ubs.com 直 GET 不行(SSR HTML 没 jobs),需 Playwright 渲染。每 site 50 jobs / 页 (含 Investment Banking Analyst/Fixed Income Structurer/Senior Investment Officer 等 SAIF 关键岗)。

  # HSBC mycareer.hsbc.com SearchJobs portal — 2026-05-19 实测全 50 条全
  # 在 Poland(HSBC Global Shared Center,Operations/Tech 后台岗),Asia
  # 过滤后 0 条入库。SAIF 相关性极低。代码 `_fetch_hsbc_search_html` 保留
  # 在 crawler 模块,等将来 HSBC HK/SG 真招聘启用了再 re-enable。
