job:
  company: "嘉实基金管理有限公司"
  job_title: "2027届校招-股票行业分析师"
  location: "北京市"
  experience: "应届"
  education: "硕士研究生及以上"
  description: |
    嘉实行业分析师坚持自主培养的道路，在实习中，您将在专属导师的指导下：
    1、对行业及上市公司进行跟踪，提交盈利预测、建立模拟组合，寻找战略标的，探索未来的投资场景；
    2、针对上市公司及所属行业制定研究计划，收集行业最新动态，找寻高质量、差异化的信息，建设数字化投研平台，链接好产业、好公司，服务财富增长；
    3、根据提出的研究课题进行专题研究、产业研究，从基础到进阶。

    我们在寻找这样的你：
    1、国内外知名院校2027届应届毕业生，硕士研究生及以上学历学位，经济、金融、理工类、医药学类相关专业，复合专业背景者优先；
    2、具备一/二级市场实习经验，既能够独立撰写行业和上市公司研究报告，也能够站在巨人的肩膀上，善于利用公司资源，产出优质结果；
    3、熟练掌握Python、SQL等编程语言，有较强的动手能力。英文可作为工作语言；
    4、熟悉任一机器学习分支领域（如统计学习、深度学习、强化学习、组合优化）；
    5、具备良好的逻辑思维、严谨的研究习惯、优秀的沟通和团队协作能力，对金融投研、机器学习和人工智能领域有浓厚兴趣；
    6、具有良好的抗压能力、协作精神，积极主动、独立思考能力，对数字化、智能化有浓厚兴趣。
