job:
  company: "富国基金管理有限公司"
  job_title: "产品研究员-产品经理（公募）-2027届暑期实习"
  location: "上海市"
  experience: "暑期实习"
  education: "硕士及以上"
  description: |
    岗位描述：
    1、跟踪研究国内外公募和资产管理行业发展动态，开展公募产品、公募战略相关研究工作，撰写研究报告；
    2、提出公募产品设计思路，论证产品可行性，推动各类型公募产品开发；
    3、完成公募基金申报文件的准备、申报等工作，与投资、销售协同推动产品发行成立；
    4、负责公募产品全生命周期管理，对存续产品进行梳理、维护及优化。

    任职资格：
    1、2027届硕士研究生及以上学历毕业生，金融、经济、计算机、数学等相关专业，有计算机加金融等复合专业背景者优先；
    2、自驱力强，有责任心，认真细致，研究能力、数据分析能力和编程能力强，文字能力佳，理解AI模型及相关技术，并有金融领域应用经验者优先；
    3、具备良好的沟通协调能力和团队协作意识；
    4、具备公募基金、证券公司、保险公司、银行理财或其他资产管理行业的相关实习经验者优先。
