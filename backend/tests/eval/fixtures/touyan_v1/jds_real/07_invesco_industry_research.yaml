source: db_job_id_70910
expected_track: "公募基金/行业研究"
canonical_track: "二级买方·基本面"
job:
  company: "景顺长城基金管理有限公司"
  job_title: "行业研究岗-深圳"
  location: "深圳"
  experience: "应届"
  education: "硕士及以上"
  description: |
    岗位职责：
    1、对所负责的行业进行深入研究和分析，跟踪行业发展动态及行业政策，撰写行业信息点评和行业政策市场效应分析等报告；
    2、结合行业分析，对上市公司进行深入及前瞻性的研究，挖掘上市公司的投资机会，提供分析研究及投资价值报告，为投资经理的决策提供建议；
    3、外部联络与沟通，包括但不限于通过行业主管部门了解行业动向、发展趋势、行业平均情况，与券商研究所及其他基金研究员交流行业研究成果，探讨热点问题。

    任职要求：
    1、2027届硕士应届毕业生，经济、金融、理工科等相关专业者优先考虑；
    2、具有二级市场行业研究实习经验，对行业研究工作有热情；
    3、优秀的学习能力，良好的逻辑及分析能力；
    4、良好的沟通协调能力，高度的责任心及团队意识；
    5、优秀的英语听说读写能力，熟练掌握各类办公软件。
