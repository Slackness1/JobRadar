job:
  company: "华夏基金管理有限公司"
  job_title: "【实习】宏观研究员"
  location: "北京市"
  experience: "实习"
  education: "硕士及以上"
  description: |
    岗位职责：
    1、AI 赋能的深度投研：运用前沿大语言模型及智能体（Agent）框架，高效处理全球宏观经济数据、政策报告及长篇行业研报等海量非结构化信息，精准提炼宏观主线与大类资产定价逻辑；
    2、投研工作流重构与编排：结合 FICC 业务场景，设计并搭建自动化的信息追踪与数据提取链路。无需从零编写底层代码，但需熟练运用提示词工程（Prompt Engineering）引导大模型生成代码、清洗数据，实现日常基本面追踪体系的自动化迭代；
    3、策略构想与逻辑验证：协同组内主观及量化研究员，将投资假设转化为可被 AI 执行的逻辑指令。辅助构建 QIS（量化投资策略）指数底层逻辑，或快速验证特定资产（如债券 ETF）轮动策略的初步可行性；
    4、数据审核与逻辑校验：作为投研决策的关键把控者，利用深厚的金融常识对 AI 产出的数据、图表及研究结论进行严格的交叉验证（Fact-check），有效规避模型"幻觉"，确保投研观点的严谨性与实战落地价值。

    任职要求：
    1、国内外知名高校硕士及以上学历，经济学、金融学、金融工程或相关复合学科背景2027年应届毕业生；
    2、擅长 Prompt Engineering，能熟练运用精准的高级提示词技巧拆解复杂的金融问题；
    3、具备扎实的宏观经济学与金融学底蕴，对固定收益、大宗商品等 FICC 大类资产的定价机制有深刻认知；
    4、具备极强的逻辑辨误能力，能敏锐识别模型生成内容中的经济学常识谬误或逻辑漏洞，并具备持续迭代、优化系统输入指令的闭环工作思维；
    5、诚信正直、锐意进取、担当敢为。
