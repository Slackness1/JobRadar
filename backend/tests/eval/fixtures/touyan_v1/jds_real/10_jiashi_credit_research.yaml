  description: |
    岗位职责：
    在实习中您将在导师的指导下参与：了解国内债券市场，学习信用研究的框架与方法，开展产业、行业和发债主体的信用研究。

    我们在寻找这样的你：
    1、国内外知名院校2027届应届毕业生，硕士研究生及以上学历，经济、金融等相关专业；具有扎实的经济、金融专业基础，对宏观经济、债券市场有较好的知识储备；
    2、热爱探索未知、通过独立思考、严谨地推理与分析持续探索事物的本质；
    3、至少熟悉一门编程语言，能够借助量化建模的方式分析、解决问题；
    4、具有良好的沟通能力、愿意影响他人；
    5、自驱、抗压、乐于分享与协作，工作严谨细致，责任心强；
    6、具有资管机构固收领域实习经验者优先。
