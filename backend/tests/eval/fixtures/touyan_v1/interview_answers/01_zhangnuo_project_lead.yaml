# 张诺答"主导项目"题。中等偏长的高质量回答 — 强方法论,弱在量化结果细节。
# 测 follow-up 会不会钉死在光伏项目深挖,而不是跳到她另一段量化实习。
transcript:
  - role: assistant
    content: "请用 1-2 分钟做个自我介绍,最后落到为什么你和这个岗位匹配。"
  - role: user
    content: "面试官好,我是张诺,上海交大安泰金融本科应届。我有两段实习:中信证券研究所电力新能源行业组的实习研究员,跟着首席覆盖了 8 家上市公司;还有国泰君安自营部的量化研究实习,复现过两个低频选股因子。我对行业研究方法论比较扎实,也有量化基础,做公募基金研究员是我目标。"
  - role: assistant
    content: "讲一段你最近主导的项目:客户/团队的痛点是什么,你的目标是什么,你用了什么方法。"
  - role: user
    content: "在中信的时候,我们组跟踪光伏行业,当时整个板块在跌。痛点是:客户都在问'什么时候能见底',但我们没有一个系统的框架。我做的事是:把过去三轮光伏周期(2008/2012/2018)的供需数据 + 价格数据全部整理,用我自己搭的供需平衡表预测了硅料/硅片/电池片/组件四个环节 2024-2026 的产能利用率。基于这个我写了一篇深度,结论是 2025 Q3 见底,我的首席采用并发了出去。"

current_main_question: "讲一段你最近主导的项目:客户/团队的痛点是什么,你的目标是什么,你用了什么方法。"
current_main_answer: "在中信的时候,我们组跟踪光伏行业,当时整个板块在跌。痛点是:客户都在问'什么时候能见底',但我们没有一个系统的框架。我做的事是:把过去三轮光伏周期(2008/2012/2018)的供需数据 + 价格数据全部整理,用我自己搭的供需平衡表预测了硅料/硅片/电池片/组件四个环节 2024-2026 的产能利用率。基于这个我写了一篇深度,结论是 2025 Q3 见底,我的首席采用并发了出去。"

weakness:
  avg_score: 75
  weak_topics: ["量化结果数字", "敏感性分析"]
  strong_topics: ["方法论(周期复盘)", "项目主导性"]

# 期望 follow-up 击中下面 4 项之一(judge 判分用)
expected_followup_targets:
  - "供需平衡表的关键假设(硅料新增产能 / 装机增速 / 库存)"
  - "为什么是 2025 Q3 而不是 Q4 / Q2"
  - "深度报告发出后市场反馈 / 客户使用情况"
  - "能不能复盘三轮周期跟当前这一轮的差异点"

# 必须避免的 follow-up(judge 看到这种就扣分)
expected_followup_targets_must_avoid:
  - "你国泰君安实习里那个因子是怎么做的"   # 跳到候选人简历另一段经历
  - "你为什么选金融行业"                   # 偏离当前项目
  - "你的 GPA 是多少"                      # 跟项目深挖无关
