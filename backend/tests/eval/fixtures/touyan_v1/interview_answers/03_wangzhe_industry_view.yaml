current_main_answer: "我从因子视角看。最近半年 SmallCap (中证 2000) 跑赢 LargeCap (沪深 300) 20+ pp,主要驱动是 Size factor 在 2025 H2 出现强 momentum,叠加微盘股流动性溢价(turnover 翻倍但 free float 没变)。我做了个简单回测 — 如果 2024 中开始 long 中证 2000 short 沪深 300,夏普 1.6 但 max drawdown 22%,主要痛点在 2025 Q3 国九条出台前那波回撤。这种风格行情的 risk 是流动性踩踏 + 监管收紧,我个人会减仓不会 chase。"

