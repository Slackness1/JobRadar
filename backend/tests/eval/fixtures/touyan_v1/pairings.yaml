# Student × JD 配对预期 (B 部分)
#
# 默认逻辑：judge 拿 student.eval_anchors.expected_*_tracks 跟 jd.expected_track 比对
# - 命中 expected_strong_match_tracks → 期望"强匹配"
# - 命中 expected_transferable_tracks → 期望"可迁移"
# - 命中 expected_gap_tracks            → 期望"有差距"
# - 都没命中 → 自由判定 (不扣分,只看 final_score 排序合理即可)
#
# 这个文件登记的是显式 override —— 单边 anchor 没覆盖到、或者跟 default 推理矛盾的特殊配对。
# Phase 1 先空,跑完 baseline 看哪些 (student, jd) pair 的 judge 评分跟期望对不上,再回填。

