id: jds/01_mutual_fund_research
expected_track: "公募基金/研究"
job:
  company: "广发基金"
  job_title: "行业研究员（消费方向）· 2026 校招"
  location: "广州"
  experience: "应届毕业生"
  education: "硕士及以上（本科优秀者可破格）"
  description: |
    岗位职责：
    1. 跟踪覆盖大消费板块（食品饮料 / 美护 / 家电）共 30+ 家上市公司
    2. 撰写公司深度报告 + 行业专题报告，配合基金经理投资决策
    3. 维护公司财务模型 + 季度盈利预测，跟踪季报 / 年报关键数据
    4. 参与上市公司调研，与卖方分析师 / 行业一线建立信息网络

    任职要求：
    1. 国内外知名院校 金融 / 经济 / 管理 / 数学类硕士及以上学历
    2. 有头部券商研究所 / 头部公募 / 一级市场 PE 实习经历者优先
    3. 对消费行业有持续研究兴趣 + 独立深度报告产出经历
    4. CFA / FRM 持证或备考者优先
    5. 熟悉 Wind / iFinD，Excel 财务建模能力扎实
