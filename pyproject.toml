[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "jobradar-local"
version = "0.1.0a1"
description = "Local-first JobRadar TUI for job search and grounded resume optimization"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Chuanbo Zhou" }]
dependencies = [
  "httpx>=0.27,<1",
  "platformdirs>=4.3,<5",
  "pydantic>=2.9,<3",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "textual>=3,<8",
  "tomli-w>=1.1,<2",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
]

[project.scripts]
jobradar = "jobradar_tui.cli:app"

[project.urls]
Homepage = "https://github.com/Slackness1/JobRadar"
Documentation = "https://github.com/Slackness1/JobRadar#local-tui"
Issues = "https://github.com/Slackness1/JobRadar/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/jobradar_core", "src/jobradar_tui"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests/local_tui",
  "/README.md",
  "/docs/local-tui.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests/local_tui"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
